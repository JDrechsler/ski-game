<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Ceros Ski</title><script defer="defer" src="bundle.js"></script></head><body><canvas id="skiCanvas"></canvas><div id="menuOverlay" class="menu-overlay"><div id="startMenu" class="menu-panel"><div class="menu-title">Ski Game</div><div class="menu-subtitle">Ski downhill, dodge obstacles, collect treasure!</div><button id="startBtn" class="menu-btn primary">Start Game</button> <button id="optionsBtnStart" class="menu-btn secondary">Options</button><div class="controls-info"><div class="control-row"><span class="key-badge">&larr; &rarr;</span> Steer</div><div class="control-row"><span class="key-badge">Space</span> Jump</div><div class="control-row"><span class="key-badge">P / Esc</span> Pause</div><div class="control-row mobile-only"><span class="key-badge">Tap</span> Left/Right to steer</div><div class="control-row mobile-only"><span class="key-badge">Swipe Up</span> Jump</div></div><div class="build-timestamp build-timestamp-display"></div></div><div id="pauseMenu" class="menu-panel hidden"><div class="menu-title small">Paused</div><div id="pauseScore" class="menu-score"></div><div id="pauseBiome" class="menu-biome"></div><button id="resumeBtn" class="menu-btn primary">Resume</button> <button id="optionsBtnPause" class="menu-btn secondary">Options</button> <button id="restartBtnPause" class="menu-btn secondary">Restart</button><div class="build-timestamp build-timestamp-display"></div></div><div id="gameOverMenu" class="menu-panel hidden"><div class="menu-title small">Game Over</div><div id="finalScore" class="menu-score"></div><div id="highScore" class="menu-score high-score"></div><div id="coinsCollected" class="menu-coins"></div><button id="restartBtn" class="menu-btn primary">Play Again</button><div class="build-timestamp build-timestamp-display"></div></div><div id="optionsMenu" class="menu-panel hidden"><div class="menu-title small">Options</div><div class="option-group"><label class="option-label">Zoom Level</label><div class="option-row"><input type="range" id="zoomSlider" class="option-slider" min="0.5" max="2" step="0.1" value="1"/> <span id="zoomValue" class="option-value">1.0x</span></div></div><button id="optionsBackBtn" class="menu-btn secondary">Back</button></div></div><div id="mobileControls" class="mobile-controls hidden"><button id="mobileJumpBtn" class="mobile-jump-btn">JUMP</button></div></body></html>
